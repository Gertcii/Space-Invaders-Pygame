repos:
- repo: local
  hooks:
    - id: flake8
      name: flake8
      entry: poetry run flake8
      language: system
      types: [python]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-merge-conflict
    - id: detect-private-key
    - id: debug-statements
