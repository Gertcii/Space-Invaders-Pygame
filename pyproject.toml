[project]
name = "space-invaders-pygame"
version = "0.1.0"
description = "slurm lesson 3.3-2"
authors = [
    {name = "Gertcii",email = "polishkagerc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "flake8-builtins (>=3.1.0,<4.0.0)",
    "flake8-bugbear (>=25.10.21,<26.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "black (>=25.9.0,<26.0.0)"
]

[tool.flake8]
    max-line-length = 120  # Максимальная длина строки до 120 символов
    max-complexity = 10
    exclude = [
        ".git",
        "__pycache__",
        "migrations",
        "build",
        "dist",
        "venv",
        ".venv",
        "*.egg-info",
    ]
    ignore = [
        "E203",  # Whitespace before ':'
        "W503",  # Line break before binary operator
    ]

[tool.black]
    line-length = 120
